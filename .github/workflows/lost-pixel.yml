name: Lost Pixel

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

env:
  LOST_PIXEL_DISABLE_TELEMETRY: 1

jobs:
  lost-pixel:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          path: latest
          sparse-checkout: |
            .lostpixel-baseline
      - name: Get baseline ref
        id: get-ref
        run: |
          Write-Output "ref=$(Get-Content -Path ./latest/.lostpixel-baseline)" >> $env:GITHUB_OUTPUT
          Remove-Item -Path ./latest -Recurse -Force
      - name: Checkout (baseline)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get-ref.outputs.ref }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpx playwright install chromium --with-deps
      - name: Build story (baseline)
        run: pnpm run story:build
      - name: Lost Pixel (baseline)
        run: pnpm lost-pixel
        env:
          LOST_PIXEL_MODE: update
      - name: Upload artifact (baseline)
        id: upload-baseline
        uses: actions/upload-artifact@v4
        with:
          name: lost-pixel-baseline
          path: |
            .lostpixel/baseline

      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - name: Build story (head)
        run: pnpm run story:build
      - name: Download baseline from artifact
        id: download-baseline
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload-baseline.outputs.artifact-id }}
      - name: Expand baseline artifact
        env:
          DOWNLOAD_PATH: ${{ steps.download-baseline.outputs.download-path }}
        run: |
          New-Item -Path . -ItemType Directory -Name .lostpixel
          Move-Item -Path "$env:DOWNLOAD_PATH/lost-pixel-baseline" -Destination ./.lostpixel/baseline
      - name: Lost Pixel (head)
        run: pnpm lost-pixel
      - name: Upload artifact (head)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lost-pixel-result
          path: |
            .lostpixel/baseline
            .lostpixel/current
            .lostpixel/difference
