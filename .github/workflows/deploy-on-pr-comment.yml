name: Invoke deployment on pull request comment

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  invoke_deployment:
    permissions:
      contents: read
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/preview' && github.event.comment.user.login == github.repository_owner }}
    uses: ./.github/workflows/deploy.yml
    with:
      ref: refs/pull/${{ github.event.issue.number }}/head
    secrets: inherit
