name: Deploy on PR comment

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  invoke_deployment:
    permissions:
      contents: read
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/preview' && github.event.comment.user.login == github.repository_owner }}
    uses: ./.github/workflows/deploy.yml
    with:
      ref: refs/pull/${{ github.event.issue.number }}/head
    secrets: inherit

  comment_workflow_url:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/preview' && github.event.comment.user.login == github.repository_owner }}

    steps:
      - name: Comment workflow url
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        with:
          script: |
            github.rest.issues.createComment({
              process.env.GITHUB_REPOSITORY_OWNER,
              process.env.GITHUB_REPOSITORY.replace(`${process.env.GITHUB_REPOSITORY_OWNER}/`, ''),
              process.env.ISSUE_NUMBER,
              `@${process.env.COMMENT_USER}\nhttps://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
