name: Deploy on PR comment

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  invoke_deployment:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/preview' && github.event.comment.user.login == github.repository_owner }}

    steps:
      - name: Comment workflow url
        id: comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          result-encoding: string
          script: |
            const res = github.rest.issues.createComment({
              owner: process.env.GITHUB_REPOSITORY_OWNER,
              repo: process.env.GITHUB_REPOSITORY.replace(`${process.env.GITHUB_REPOSITORY_OWNER}/`, ''),
              issue_number: process.env.ISSUE_NUMBER,
              body: `Deployment is ongoing.\n\nCheck logs at https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
            return res.id;
      - uses: ./.github/workflows/deploy.yml
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
      - name: Comment workflow result (success)
        if: ${{ !failure() }}
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ steps.comment.outputs.result }}
        with:
          script: |
            github.rest.issues.updateComment({
              owner: process.env.GITHUB_REPOSITORY_OWNER,
              repo: process.env.GITHUB_REPOSITORY.replace(`${process.env.GITHUB_REPOSITORY_OWNER}/`, ''),
              comment_id: process.env.COMMENT_ID,
              body: `Deployment is ongoing.\n\nCheck logs at https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\n\nDeployment successfully finished.`
            });
      - name: Comment workflow result (failure)
        if: ${{ failure() }}
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ steps.comment.outputs.result }}
        with:
          script: |
            github.rest.issues.updateComment({
              owner: process.env.GITHUB_REPOSITORY_OWNER,
              repo: process.env.GITHUB_REPOSITORY.replace(`${process.env.GITHUB_REPOSITORY_OWNER}/`, ''),
              comment_id: process.env.COMMENT_ID,
              body: `Deployment is ongoing.\n\nCheck logs at https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\n\nDeployment failed.`
            });
